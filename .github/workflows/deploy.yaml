name: Deploy Market-ML

# Manual only: the EKS cluster this targets does not exist (yet). The planned
# deployment is a single container on AWS (ECS Express Mode or Lightsail Containers);
# until then this workflow would fail on every push.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/market-ml:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/market-ml:${{ github.sha }}

      - name: Update image tag in deployment
        run: |
          sed -i "s|image:.*|image: ghcr.io/${{ github.repository_owner }}/market-ml:${{ github.sha }}|" k8s/deployment.yaml

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region eu-central-1 --name market-ml-cluster

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/
